# Artifact Center — local infrastructure
# Usage: docker compose up -d
services:
  postgres:
    image: postgres:16-alpine
    container_name: artifact-center-db
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: artifact
      POSTGRES_PASSWORD: artifact
      POSTGRES_DB: artifact_center
    volumes:
      - ac_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U artifact -d artifact_center']
      interval: 5s
      timeout: 5s
      retries: 10

  # Optional local S3-compatible target for testing direct multipart upload.
  # Configure OBJECT_STORAGE_* in the API environment before enabling it.
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: artifact-center-minio
    restart: unless-stopped
    command: server /data --console-address ':9001'
    ports:
      - '9000:9000'
      - '9001:9001'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-artifact-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-this-minio-secret}
    volumes:
      - ac_minio_data:/data

volumes:
  ac_pg_data:
  ac_minio_data:
